<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>일흔 번째 칸 — 관리</title>
<link rel="icon" type="image/png" sizes="192x192" href="icon/icon-192.png">
<style>
@font-face{font-family:"Y Serif";src:url("font/serif.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Y Serif";src:url("font/serifb.woff2") format("woff2");font-weight:700;font-display:swap}
:root{
  --hanji:#efe6d2;--hanji-2:#e6dcc5;--hanji-3:#ddd0b3;--line:#c4b491;--ink:#2a211a;--soft:#6c5d4b;--mute:#9a8b74;
  --gold:#b8860b;--gold-2:#8a6508;--green:#3f7a4a;--red:#a2452f;--blue:#3d5f8a;
  --serif:"Y Serif","Noto Serif KR","Nanum Myeongjo",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--hanji);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
[hidden]{display:none!important}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff8ea;color:var(--ink);border-radius:8px;padding:7px 13px;line-height:1.2}
button:hover{background:#fffdf6}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--gold);border-color:var(--gold-2);color:#fff;font-weight:700}
button.pri:hover{background:#c9950f}
button.danger{color:var(--red)}
button.sm{padding:4px 9px;font-size:13px;border-radius:6px}
input,select{font:inherit;color:var(--ink);background:#fffaf0;border:1px solid var(--line);border-radius:7px;padding:6px 9px;outline:none;min-width:0}
input:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,134,11,.18)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header img{width:44px;height:auto}
header h1{font:700 22px/1.2 var(--serif);margin:0}
header .sub{color:var(--soft);font-size:13px}
header .sp{flex:1}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}
.stat{background:var(--hanji-2);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-width:96px}
.stat b{display:block;font-size:20px;font-family:var(--serif)}
.stat span{font-size:12px;color:var(--soft)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1;min-width:160px}
.msg{font-size:13px;color:var(--soft);min-height:1.2em}
.msg.err{color:var(--red)}
/* 표 */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fbf6ea}
table{border-collapse:collapse;width:100%;min-width:900px}
th,td{padding:8px 10px;border-bottom:1px solid #e3d8c0;text-align:left;vertical-align:middle;white-space:nowrap}
th{font-size:12px;color:var(--soft);font-weight:600;background:var(--hanji-2);position:sticky;top:0;z-index:1}
tr.row:hover td{background:#fffcf3}
tr.row td.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.3px}
td input{width:100%}
td.name input{width:96px}
td.memo input{width:140px}
th,td{padding:8px 7px}
table{min-width:0}
.st{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:#fff}
.st.none{color:var(--mute)}
.st.given{color:var(--blue);border-color:#b8c6dc;background:#eef3fa}
.st.live{color:var(--green);border-color:#b5cfbb;background:#edf6ee}
.gr{display:inline-block;min-width:34px;text-align:center;font-size:12px;border-radius:6px;padding:2px 6px;background:#f1eadb;color:var(--soft)}
.gr.g1{background:#f6e7b8;color:#7a5600;font-weight:700}
.gr.g2{background:#dcebdd;color:#2f6a3a}
.gr.g3{background:#f1d9d2;color:#8d3a26}
.ok{color:var(--green);font-size:12px;margin-left:6px}
tr.detail td{background:#f5efe0;white-space:normal;padding:12px 16px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.dbox{background:#fffaf0;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px}
.dbox h4{margin:0 0 6px;font-size:13px;color:var(--soft);font-weight:600}
.dbox .wr{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.dbox .wr span{background:#f1d9d2;color:#8d3a26;border-radius:5px;padding:1px 6px;font-size:12px}
.ratebar{height:7px;background:#e8dfc9;border-radius:4px;overflow:hidden;margin:3px 0 6px}
.ratebar i{display:block;height:100%;background:var(--gold)}
.act{display:flex;gap:6px}
.act .confirm{color:var(--red);font-size:12px}
.foot{margin-top:14px;font-size:12px;color:var(--mute)}
/* 열쇠 화면 */
#login{max-width:420px;margin:12vh auto 0;background:#fbf6ea;border:1px solid var(--line);border-radius:14px;padding:26px 24px;text-align:center}
#login img{width:120px;height:auto;margin-bottom:6px}
#login h1{font:700 22px/1.3 var(--serif);margin:4px 0 2px}
#login p{color:var(--soft);font-size:13px;margin:0 0 16px}
#login form{display:flex;gap:8px}
#login input{flex:1;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
/* 모바일 카드 */
@media (max-width:760px){
  .wrap{padding:12px}
  .tblwrap{overflow:visible;border:0;background:none}
  table,thead,tbody,tr,td{display:block;min-width:0}
  thead{display:none}
  tr.row{background:#fbf6ea;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
  tr.row td{border:0;padding:3px 0;white-space:normal}
  tr.row td::before{content:attr(data-l);display:inline-block;width:68px;font-size:12px;color:var(--soft)}
  tr.row td.code{font-size:17px}
  tr.row td.code::before{display:none}
  tr.row td.ch{display:inline-block;padding:4px 10px 0 0}
  tr.row td.ch::before{width:auto;margin-right:4px}
  td.name input,td.memo input{width:calc(100% - 72px)}
  tr.detail{margin:-6px 0 10px}
  tr.detail td{border-radius:0 0 12px 12px}
  .act{justify-content:flex-end}
}
</style>
</head>
<body>
<div class="wrap">
  <section id="login">
    <img src="img/logo_mark.webp" alt="">
    <h1>일흔 번째 칸 · 관리</h1>
    <p>관리자 키를 넣어 줘. 이 기기엔 기억돼.</p>
    <form id="lform"><input id="key" placeholder="ADM-…" autocomplete="off" autocapitalize="characters"><button class="pri">들어가기</button></form>
    <div class="msg" id="lmsg"></div>
  </section>

  <section id="app" hidden>
    <header>
      <img src="img/logo_mark.webp" alt="">
      <div><h1>일흔 번째 칸 · 관리</h1><div class="sub">접속 코드 · 학생 이름 · 플레이 기록</div></div>
      <div class="sp"></div>
      <button id="refresh">새로 고침</button>
      <button id="csv">CSV 내려받기</button>
      <button id="logout" class="sm">키 지우기</button>
    </header>
    <div class="stats" id="stats"></div>
    <div class="bar">
      <input type="search" id="q" placeholder="이름·코드·메모 검색">
      <select id="filter"><option value="">전체</option><option value="none">미배포</option><option value="given">배포됨(미접속)</option><option value="live">접속함</option><option value="play">플레이 기록 있음</option></select>
      <button id="add" class="pri">코드 10개 추가</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="tblwrap">
      <table>
        <thead><tr>
          <th>코드</th><th>이름</th><th>메모</th><th>상태</th><th>진도</th>
          <th>1화</th><th>2화</th><th>3화</th><th>4화</th><th>5화</th><th>최종</th>
          <th>마지막 접속</th><th></th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <div class="foot">코드는 기기 하나에만 붙어. 학생이 기기를 바꾸면 그 줄의 「기기 초기화」를 눌러 주면 새 기기로 다시 들어올 수 있어. 삭제는 코드와 기록을 모두 지우니 두 번 눌러 확인해.</div>
  </section>
</div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbz4_MajMDM-APQqHY9xg3mu5QAwjS5f1YgdXcVYvIb307I_B0LsWte61vUoY0V5OmvGlA/exec';
const CH = {1:'1화',2:'2화',3:'3화',4:'4화',5:'5화'};
const WHO = {seomuk:'서묵',irang:'이랑',doha:'도하',taegyeom:'태겸',ijae:'이재'};
const $ = s => document.querySelector(s);
let KEY = '', ROWS = [], open = new Set();

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(iso){ if(!iso) return '—'; const d=new Date(iso); if(isNaN(d)) return '—'; const p=n=>String(n).padStart(2,'0'); return `${d.getMonth()+1}/${d.getDate()} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtTime(s){ s=Number(s)||0; if(!s) return '—'; const m=Math.round(s/60); return m<60? m+'분' : Math.floor(m/60)+'시간 '+(m%60)+'분'; }
function grade(c){ if(!c) return ''; if(c.g) return c.g; const s=c.best!=null?c.best:c.s; if(s==null) return ''; return s>=90?'장원':s>=70?'급제':'낙방'; }
function gcls(g){ return g==='장원'?'g1':g==='급제'?'g2':g==='낙방'?'g3':''; }
function state(r){ if(r.used) return 'live'; if(r.name) return 'given'; return 'none'; }

async function api(params){
  const u = new URL(API); u.searchParams.set('admin', KEY);
  Object.keys(params).forEach(k => { if(params[k]!=null) u.searchParams.set(k, params[k]); });
  const res = await fetch(u.toString(), {redirect:'follow'});
  const j = await res.json();
  return j;
}

async function load(){
  setMsg('불러오는 중…');
  try{
    const j = await api({op:'list'});
    if(!j.ok){ throw new Error(j.reason||'fail'); }
    ROWS = j.codes || [];
    localStorage.setItem('c70-adm', KEY);
    $('#login').hidden = true; $('#app').hidden = false;
    render(); setMsg('');
  }catch(e){
    if(!ROWS.length){ $('#lmsg').textContent = '키가 맞지 않거나 서버에 닿지 않아. (' + (e.message||e) + ')'; $('#lmsg').className='msg err'; }
    else setMsg('불러오기 실패: ' + (e.message||e), true);
  }
}
function setMsg(t, err){ const m=$('#msg'); m.textContent=t; m.className='msg'+(err?' err':''); }

function render(){
  const q = ($('#q').value||'').trim().toLowerCase(), f = $('#filter').value;
  const rows = ROWS.filter(r => {
    const st = state(r);
    if(f==='play' ? !(r.prog&&r.prog.ch&&Object.keys(r.prog.ch).length) : (f && st!==f)) return false;
    if(!q) return true;
    return (r.code+' '+(r.name||'')+' '+(r.memo||'')).toLowerCase().includes(q);
  });
  // 통계
  const n = ROWS.length, given = ROWS.filter(r=>r.name||r.used).length, live = ROWS.filter(r=>r.used).length,
        play = ROWS.filter(r=>r.prog&&r.prog.ch&&Object.keys(r.prog.ch).length).length,
        fin = ROWS.filter(r=>r.prog&&r.prog.final).length;
  $('#stats').innerHTML = [[n,'코드 전체'],[given,'배포됨'],[live,'접속함'],[play,'플레이 기록'],[fin,'최종 시험 완료']]
    .map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('');
  // 표
  const tb = $('#tb'); tb.innerHTML = '';
  rows.forEach(r => {
    const p = r.prog || {}, ch = p.ch || {}, st = state(r);
    const tr = document.createElement('tr'); tr.className='row'; tr.dataset.code=r.code;
    const cells = [];
    cells.push(`<td class="code" data-l="코드">${esc(r.code)}</td>`);
    cells.push(`<td class="name" data-l="이름"><input data-f="name" value="${esc(r.name)}" placeholder="이름"></td>`);
    cells.push(`<td class="memo" data-l="메모"><input data-f="memo" value="${esc(r.memo)}" placeholder="학교·반·연락 등"></td>`);
    cells.push(`<td data-l="상태"><span class="st ${st}">${st==='live'?'접속함':st==='given'?'배포됨':'미배포'}</span></td>`);
    cells.push(`<td data-l="진도">${esc(p.pos||(st==='live'?'시작':'—'))}</td>`);
    for(let i=1;i<=5;i++){ const c=ch[i]; const g=grade(c); const s=c?(c.best!=null?c.best:c.s):null;
      cells.push(`<td class="ch" data-l="${CH[i]}">${c?`<span class="gr ${gcls(g)}" title="${esc(g)}">${s!=null?s:'·'}</span>`:'<span class="gr">—</span>'}</td>`); }
    const F = p.final;
    cells.push(`<td class="ch" data-l="최종">${F?`<span class="gr ${F.pass?'g1':'g3'}">${esc(F.s)}${F.total?'/'+esc(F.total):''}</span>${F.pick?' <small>'+esc(F.pick)+'</small>':''}`:'<span class="gr">—</span>'}</td>`);
    cells.push(`<td data-l="접속">${fmt(r.last)}</td>`);
    cells.push(`<td data-l=""><div class="act"><button class="sm" data-a="toggle">${open.has(r.code)?'접기':'자세히'}</button><button class="sm" data-a="reset" ${r.used?'':'disabled'}>기기 초기화</button><button class="sm danger" data-a="remove">삭제</button></div></td>`);
    tr.innerHTML = cells.join('');
    tb.appendChild(tr);
    if(open.has(r.code)){
      const d = document.createElement('tr'); d.className='detail';
      d.innerHTML = `<td colspan="13">${detail(r)}</td>`;
      tb.appendChild(d);
    }
  });
  if(!rows.length) tb.innerHTML = '<tr><td colspan="13" style="color:var(--mute);text-align:center;padding:24px">해당하는 코드가 없어</td></tr>';
}

function detail(r){
  const p = r.prog || {}, ch = p.ch || {};
  const boxes = [];
  boxes.push(`<div class="dbox"><h4>접속</h4>처음 ${fmt(r.first)} · 마지막 ${fmt(r.last)}<br>플레이 ${p.plays||0}회 · ${fmtTime(p.time)}<br><span style="color:var(--mute)">기기 ${esc((r.device||'').slice(0,10))}${r.device?'…':'—'}</span></div>`);
  for(let i=1;i<=5;i++){ const c=ch[i]; if(!c) continue; const g=grade(c);
    boxes.push(`<div class="dbox"><h4>${CH[i]} <span class="gr ${gcls(g)}">${esc(g)||'·'}</span></h4>점수 ${c.s!=null?c.s:'—'}${c.best!=null&&c.best!==c.s?' (최고 '+c.best+')':''} · ${c.n||1}회${c.t?' · '+fmt(c.t):''}${c.w&&c.w.length?`<div>틀린 문항<div class="wr">${c.w.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`:'<div style="color:var(--green)">실전 전부 정답</div>'}</div>`); }
  if(p.rate){ boxes.push(`<div class="dbox"><h4>인물별 암기율</h4>${Object.keys(WHO).filter(k=>p.rate[k]!=null).map(k=>{const v=Math.round((p.rate[k]<=1?p.rate[k]*100:p.rate[k]));return `${WHO[k]} ${v}%<div class="ratebar"><i style="width:${v}%"></i></div>`;}).join('')}</div>`); }
  if(p.final){ const F=p.final; boxes.push(`<div class="dbox"><h4>최종 시험</h4>${esc(F.s)}${F.total?' / '+esc(F.total):''} · ${F.pass?'통과':'미달'}${F.pick?' · 배웅: '+esc(F.pick):''}${F.t?'<br>'+fmt(F.t):''}${F.w&&F.w.length?`<div>틀린 문항<div class="wr">${F.w.map(x=>`<span>${esc(x)}</span>`).join('')}</div></div>`:''}</div>`); }
  if(!Object.keys(ch).length && !p.final) boxes.push(`<div class="dbox" style="color:var(--mute)">아직 플레이 기록이 없어. 화를 하나 끝내면 여기에 쌓여.</div>`);
  return `<div class="dgrid">${boxes.join('')}</div>`;
}

// 이름·메모 저장 (바뀐 경우만, 포커스 빠질 때)
async function saveField(code, f, v){
  const r = ROWS.find(x=>x.code===code); if(!r || (r[f]||'')===v) return;
  const j = await api({op:'name', code, [f]: v});
  if(j.ok){ r[f]=v; flash(code, f); } else setMsg('저장 실패: '+(j.reason||''), true);
}
function flash(code, f){
  const inp = document.querySelector(`tr[data-code="${code}"] input[data-f="${f}"]`); if(!inp) return;
  const old = inp.style.borderColor; inp.style.borderColor='var(--green)'; setTimeout(()=>{inp.style.borderColor=old;},900);
  if(f==='name') render();
}

$('#tb').addEventListener('focusout', e => { const inp=e.target.closest('input[data-f]'); if(!inp) return; saveField(inp.closest('tr').dataset.code, inp.dataset.f, inp.value.trim()); });
$('#tb').addEventListener('keydown', e => { if(e.key==='Enter' && e.target.matches('input[data-f]')) e.target.blur(); });
$('#tb').addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if(!b) return;
  const code = b.closest('tr').dataset.code, a = b.dataset.a;
  if(a==='toggle'){ open.has(code)?open.delete(code):open.add(code); render(); return; }
  if(a==='reset' || a==='remove'){
    if(!b.dataset.sure){ b.dataset.sure='1'; b.textContent = a==='reset'?'정말 초기화?':'정말 삭제?'; b.classList.add('confirm'); setTimeout(()=>{ if(b.isConnected){ b.dataset.sure=''; b.textContent=a==='reset'?'기기 초기화':'삭제'; } },3000); return; }
    b.disabled = true; setMsg(a==='reset'?'초기화 중…':'삭제 중…');
    const j = await api({op:a, code});
    if(j.ok){ open.delete(code); await load(); setMsg(a==='reset'?`${code} 기기 초기화 완료 — 새 기기에서 다시 들어올 수 있어.`:`${code} 삭제 완료`); }
    else setMsg('실패: '+(j.reason||''), true);
  }
});
$('#add').addEventListener('click', async () => {
  $('#add').disabled = true; setMsg('코드 만드는 중…');
  const j = await api({op:'add', n:10});
  $('#add').disabled = false;
  if(j.ok){ await load(); setMsg('추가됨: '+j.added.join(', ')); } else setMsg('실패', true);
});
$('#refresh').addEventListener('click', load);
$('#q').addEventListener('input', render);
$('#filter').addEventListener('change', render);
$('#logout').addEventListener('click', () => { localStorage.removeItem('c70-adm'); location.reload(); });
$('#csv').addEventListener('click', () => {
  const head = ['코드','이름','메모','상태','진도','1화','1화 등급','1화 틀린 문항','2화','2화 등급','2화 틀린 문항','3화','3화 등급','3화 틀린 문항','4화','4화 등급','4화 틀린 문항','5화','5화 등급','5화 틀린 문항','최종 점수','최종 통과','배웅','플레이 횟수','플레이 시간(분)','처음 접속','마지막 접속'];
  const lines = [head];
  ROWS.forEach(r => { const p=r.prog||{}, ch=p.ch||{}; const st=state(r);
    const row = [r.code, r.name||'', r.memo||'', st==='live'?'접속함':st==='given'?'배포됨':'미배포', p.pos||''];
    for(let i=1;i<=5;i++){ const c=ch[i]; row.push(c&&c.s!=null?c.s:'', grade(c), c&&c.w?c.w.join(' '):''); }
    const F=p.final||{}; row.push(F.s!=null?F.s:'', F.s!=null?(F.pass?'통과':'미달'):'', F.pick||'', p.plays||'', p.time?Math.round(p.time/60):'', r.first||'', r.last||'');
    lines.push(row); });
  const csv = '﻿' + lines.map(l => l.map(v => '"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download = '일흔번째칸_기록_'+new Date().toISOString().slice(0,10)+'.csv'; a.click();
});
$('#lform').addEventListener('submit', e => { e.preventDefault(); KEY = $('#key').value.trim().toUpperCase(); if(KEY) load(); });

(function boot(){
  try{ KEY = localStorage.getItem('c70-adm') || ''; }catch(e){}
  if(KEY){ $('#key').value = KEY; load(); }
})();
</script>
