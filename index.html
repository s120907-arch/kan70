<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일흔 번째 칸 — Coming soon</title>
<meta name="theme-color" content="#14110f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon/icon-192.png">
<style>
@font-face{font-family:"Y Serif";src:url("font/serif.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Y Serif";src:url("font/serifb.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Y Sans";src:url("font/sans.woff2") format("woff2");font-weight:400;font-display:swap}
:root{--bg:#14110f;--fg:#efe7d8;--fg-soft:#a89c8a;--line:#3a322b;--gold:#d9b87a}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Y Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;background:
 radial-gradient(1200px 600px at 50% -10%,rgba(217,184,122,.10),transparent 60%),var(--bg)}
.card{width:100%;max-width:420px;text-align:center}
.logo{width:min(220px,60vw);height:auto;display:block;margin:0 auto 28px;opacity:.95}
.kan{display:inline-block;width:56px;height:56px;border:1.5px solid var(--gold);border-radius:4px;margin:0 auto 18px;position:relative}
.kan::after{content:"";position:absolute;inset:6px;background:radial-gradient(circle at 40% 45%,#1c1916 0 38%,transparent 70%);border-radius:2px}
h1{font-family:"Y Serif",serif;font-weight:700;font-size:28px;letter-spacing:.02em;margin:0 0 6px}
.en{font-family:"Y Serif",serif;font-size:14px;letter-spacing:.28em;color:var(--gold);margin:0 0 26px;text-transform:uppercase}
p{font-size:15px;line-height:1.75;color:var(--fg-soft);margin:0 0 10px;word-break:keep-all}
hr{border:0;border-top:1px solid var(--line);margin:30px auto 18px;width:120px}
.brand{font-size:13px;color:var(--fg-soft);letter-spacing:.04em}
.brand b{color:var(--fg);font-weight:400}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="img/logo_full.webp" alt="빛이 있는 국어">
  <div class="kan" aria-hidden="true"></div>
  <h1>일흔 번째 칸</h1>
  <div class="en">Coming soon</div>
  <p>지금은 책을 잠시 덮어 두었어요.<br>칸을 조금 더 채우고 다시 열겠습니다.</p>
  <p>받은 접속 코드는 그대로 쓸 수 있어요.<br>다시 열리면 이 주소로 들어오면 됩니다.</p>
  <hr>
  <div class="brand"><b>빛이 있는 국어</b> · 손유빈</div>
</main>
</body>
</html>
